# helloworld-esp — test plan. Owned by /build.
#
# Every test, what it needs, and what it last produced. Status is written by
# whatever ran the test, never by hand: not done | successful | failed, with
# the commit it ran against. "Blocked" is computed from `needs` against
# `capabilities`, never typed.
#
# Contract: docs/Functionality/FSD.md · Rules: docs/Method/standards/testing.md

project: helloworld-esp
fsd: docs/Functionality/FSD.md
dut:
  board: Seeed XIAO ESP32S3 Sense
  chip: esp32s3
  flash: 8MB
  slot: SLOT4             # last seen; tests find the DUT by MAC (SLOT1 until the bench restart, 2026-10-17)
  observed:               # /commission, 2026-10-17, POST /api/chip/info
    date: 2026-10-17
    chip: ESP32-S3 (QFN56)
    revision: v0.2
    flash_size: 8MB       # matches FSD CON-02
    psram: Embedded PSRAM 8MB (AP_3v3)
    usb_mode: USB-Serial/JTAG
    mac: "30:30:f9:34:72:28"   # tests verify the DUT by this, not by slot label
testbench:
  # Dated observation, not an address to hard-code: tests take TESTBENCH_URL
  # from the environment and select the DUT by MAC.
  hostname: testbench-de09
  last_seen_ip: 192.168.8.70
  url: http://192.168.8.70:8080
  portal_version: not reported   # /api/info has no version field
  last_seen: 2026-10-17
  slots_configured: 10    # was 4 before the bench restart, 2026-10-17

capabilities:
  # --- Bench capabilities: declared by the testbench (Harness-FSD, Appendix D)
  # and taken at face value; a project never proves them.
  bench-flash:
    what: Flash images at explicit offsets through POST /api/flash
    available: yes
  bench-serial-monitor:
    what: Capture DUT console lines with pattern match and a recorded buffer (/api/serial/monitor, /api/serial/output)
    available: yes
    observed: 2026-10-17. The recorded buffer holds the last 1000 lines (355 s of this firmware's output).
    consequence: Windows longer than ~5 min are read in 60 s chunks (tests/target/console.py capture_for).
  bench-serial-reset:
    what: Hard-reset the DUT through POST /api/serial/reset
    available: yes
  bench-single-reset:
    what: One POST /api/serial/reset causes exactly one chip reset, with that boot's output captured from its first line
    available: no
    observed: >-
      2026-10-17, SLOT1, firmware 650b1c2. The reset call (10-11 s) returns boot A from
      ROM through heartbeat n=5 (~5.1 s), then the chip resets again as the bench
      reattaches the port; boot B's first ~2 s (ROM, banner, n=1) are lost and its
      heartbeats restart at n=2 from 11.99 s. The firmware is exonerated: a 60 s
      steady capture shows n strictly +1 with no reset.
    consequence: >-
      Tests read the first boot only (tests/target/console.py first_boot), so about
      5 s after a reset is observable. Anything needing longer from one boot
      (TC-HB-02: 10 heartbeats) is not done until the bench is fixed. Testbench
      change request needed (Embedded-AI-Harness): "serial/reset on native-USB
      ESP32-S3 resets the chip twice; second boot's early output lost".
  bench-serial-port-control:
    what: Close the DUT console port for a set time so nothing reads it, then reopen it with DTR/RTS low
    available: no
    observed: >-
      2026-10-18, from the bench source (Embedded-AI-Harness pi/portal.py,
      pi/plain_rfc2217_server.py). The proxy drains the port permanently ("Read the
      device forever"), and no endpoint stops it on its own. /api/serial/release is not
      a port release: it puts BOOT to high-Z and pulses EN, which resets the DUT. The
      earlier "available: yes" came from reading the endpoint's name.
    consequence: >-
      NFR-WDT-05 (TC-WDT-05) is not done until the bench can leave a console unread.
      Testbench change request needed (Embedded-AI-Harness): "an endpoint to close a
      slot's serial port for N seconds and reopen it with DTR/RTS low, without a reset".
  bench-wifi-scan:
    what: WiFi scan from the bench radio (GET /api/wifi/scan)
    available: yes
    observed: >-
      2026-10-17. Results carry ssid, rssi, auth and channel only, no BSSID. With the
      bench AP up the scan refuses ("cannot scan while the AP is running"), although
      the bench's FR-013 says it works alongside the AP.
    consequence: >-
      The DUT cannot be identified in a WiFi scan, so NFR-SEC-01's WiFi half is checked
      on the image (FSD 0.1.5). Testbench change request: FR-013 and the live behaviour
      disagree about scanning while the AP runs.
  bench-ble-scan:
    what: BLE advertisement scan (POST /api/ble/scan)
    available: yes
    observed: >-
      2026-10-17. timeout 5/10/20 s returns 8-9 devices; timeout 30 s returns ok:false
      with an empty error.
    consequence: >-
      Scan in 15 s pieces. Testbench change request: a 30 s scan fails without a reason.
  bench-operator-prompt:
    what: Block on an operator yes/no answered in the portal UI (POST /api/human-interaction)
    available: yes
  bench-test-progress:
    what: Live test-session progress on the portal (/api/test/update)
    available: yes

  # --- Project-side: unproven until observed working here. Each is an item on
  # testing/debugging-agenda.md; /commission flips it to yes.
  dut-on-slot:
    what: The XIAO ESP32S3 Sense enumerates on a bench slot as an ESP32-S3 with 8 MB flash and accepts a flash
    available: yes
    observed: >-
      2026-10-17. SLOT1, ESP32-S3 rev v0.2, 8 MB flash, MAC 30:30:f9:34:72:28.
      Forward path: CI run 39057559541 (commit c2761e2), artefact
      firmware-c2761e2, flashed via /api/flash at the offsets in its
      flash_args (0x0 bootloader.bin, 0x8000 partition-table.bin,
      0x10000 helloworld-esp.bin), hash verified. From that image, "main: Init complete"
      was observed after each of 5 bench resets (see dut-console-after-reset), and the
      periodic marker "main: ON" / "main: OFF" every 1000 ms.
    limit: >-
      The bench cannot report which image is on the device; the link is that ON/OFF
      and "Init complete" are exactly what c2761e2 prints. From Wave 1 the banner's
      version field (FR-BOOT-02) closes this.
    consequence: /api/serial/monitor matches its pattern as a literal substring, not a regex
  dut-console-after-reset:
    what: The first console line after a bench reset reaches the bench despite native-USB re-enumeration
    available: yes
    observed: >-
      2026-10-17. 5 of 5 bench resets (POST /api/serial/reset): "Init complete" captured
      in the reset/monitor/buffer output, followed by "main: ON".
    consequence: >-
      A bench reset appears as ROM rst:0x15 (USB_UART_CHIP_RESET), so expect
      reset_reason=USB in the banner (allowed by FR-BOOT-03 (b)). Read the boot
      line from the reset response plus /api/serial/output, not from a monitor
      opened afterwards.
  dut-user-led:
    what: An instrument observes the orange user LED on GPIO21
    available: no
    consequence: >-
      GPIO21 is not on the XIAO header, so no bench instrument can see it. By the
      owner's decision (FSD 0.1.3), FR-LED-03 is a May with human acceptance and
      CON-05 is verified by host test and review. No automated test may need this.
  dut-console-after-panic-reset:
    what: The console captures the panic report and the next boot from its first line when the firmware resets itself
    available: unproven   # debugging-agenda item 5; FR-WDT-01..03 need it (FSD 0.1.7 §3.2)
  operator:
    what: A person at the bench answers operator prompts during a run
    available: yes
    observed: >-
      2026-10-17. POST /api/human-interaction answered Done -> confirmed:true and
      Cancel -> confirmed:false. Both answers reach the caller.
    consequence: For physical acts only (plug, power, swap), never for observations

  # --- Project infrastructure
  host-toolchain:
    what: Host C compiler + CMake/CTest for tests/host, in CI (ci.yml) and the devcontainer
    available: yes
  fault-injection-image:
    what: Firmware variants fault-heartbeat / fault-blink that stall a task after 10 s (FSD §11)
    available: no        # arrives with FSD Phase 2; blocks FR-WDT-01..03 until built
  release-verification:
    what: Tag-triggered journey run against the release artefact (build.yml verify job)
    available: yes       # the container runs 24/7; an absent bench at verify time is an unmet precondition (not done)

# ---------------------------------------------------------------------------
# Journey — the standard run, one test per step, in order (Wave 1 gate).
# Every hardware session runs behind it: while it fails, later results are
# unreadable.
tests:
  - id: JRN-01.1
    name: Flash the release image
    shape: workflow
    kind: standard
    wave: 1
    phase: 1
    tier: target
    verifies: [CON-01, CON-02, CON-03]
    needs: [bench-flash, dut-on-slot]
    observable: /api/flash returns ok for every image in coldflash/flash_args
    impl: tests/target/test_journey.py::test_jrn_01_1_flash
    status: successful
    commit: 6e091e1
  - id: JRN-01.2
    name: Banner after reset
    shape: workflow
    kind: standard
    wave: 1
    phase: 1
    tier: target
    verifies: [FR-BOOT-01, FR-BOOT-02, FR-BOOT-03, CON-04]
    needs: [bench-serial-reset, bench-serial-monitor, dut-console-after-reset]
    observable: banner matching FSD A.1 within 3 s; version equals the flashed image's; reset_reason non-panic
    impl: tests/target/test_journey.py::test_jrn_01_2_banner
    status: successful
    commit: 6e091e1
  - id: JRN-01.3
    name: Heartbeat running
    shape: workflow
    kind: standard
    wave: 1
    phase: 1
    tier: target
    verifies: [FR-HB-01, FR-HB-02]
    needs: [bench-serial-monitor, dut-console-after-reset]
    observable: heartbeat n=1, 2, 3 within 3.5 s of the banner, spaced 950–1050 ms
    impl: tests/target/test_journey.py::test_jrn_01_3_heartbeat
    status: successful
    commit: 6e091e1
  - id: JRN-01.4
    name: LED toggling
    shape: workflow
    kind: standard
    wave: 1
    phase: 2
    tier: target
    verifies: [FR-LED-01, FR-LED-02]
    needs: [bench-serial-monitor]
    observable: led lines on/off/on/off within 2.5 s, spaced 450–550 ms
    impl: tests/target/test_journey.py::test_jrn_01_4_led
    status: successful
    commit: 6e091e1
  - id: JRN-01.5
    name: Operator sees the blink
    shape: workflow
    kind: standard
    wave: 1
    phase: 2
    tier: bench
    verifies: [FR-LED-03, CON-05]
    needs: [bench-operator-prompt, operator, dut-user-led]
    observable: operator answers yes to "Is the orange user LED blinking? (ignore the red charge LED)"
    impl: ""
    status: deprecated
    reason: >-
      An observation by eye is not an instrument. FR-LED-03 became a May with human
      acceptance and CON-05 is verified by host test and review (FSD 0.1.3), so the
      journey ends at JRN-01.4.

